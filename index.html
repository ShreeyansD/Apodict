    <script>
      // Gracefully prevent Vite dev client websocket connection errors from bubbling to runner
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        var stack = (event && event.error && event.error.stack) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          filename.indexOf('@vite/client') !== -1 ||
          stack.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonMsg = (event && event.reason && (event.reason.message || event.reason.stack || '')) || '';
        if (
          reasonMsg.indexOf('WebSocket') !== -1 ||
          reasonMsg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          reasonMsg.indexOf('@vite/client') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Register the service worker only on the live site, so the AI Studio preview never caches anything
      if ('serviceWorker' in navigator && /(^|\.)apodict\.app$|\.onrender\.com$/.test(location.hostname)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
